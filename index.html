<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) para el notch y la barra de gestos (§9) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E9F6E" />
    <meta
      name="description"
      content="WalletApp — control de finanzas personales: cuentas, transacciones, presupuestos y estadísticas."
    />

    <!-- El manifest y su <link> los inyecta vite-plugin-pwa en el build. -->
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/iconos/favicon-32.png" />
    <!-- iOS ignora el manifest para el icono de la pantalla de inicio. -->
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wallet" />

    <title>WalletApp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
