# pnpm 10+ lee aquí los ajustes que antes vivían en el campo "pnpm" de package.json.
#
# Estos paquetes necesitan ejecutar su script de instalación:
# - workerd: el runtime real de Cloudflare Workers. Sin su postinstall no hay
#   `vite dev` con bindings ni D1 local.
# - esbuild: descarga su binario nativo.
allowBuilds:
  esbuild: true
  workerd: true
